sip:
  settings:
    bind: 192.168.23.109:5060
  profiles:
    foo:
      sip_server: 192.168.23.190:6666
      sink: apps/live_translator/configuration1
      username: 'incoming'
      password: 'user'
      register: True
    bar:
      sip_server: 52.117.200.117:5060
      username: '1929132'
      password: 'tj9uh22'
rtp:
  settings:
    min_port: 1024
    max_port: 2048
models:
  settings:
    cache_dir: '~/.cache/Infernos'
  profiles:
    stt_wrt:
      uses: whisper_rt
      batch_size: 8
      parameters:
        beam_size: 1
        compute_type: int8
        size: medium
    tts_xtts:
      uses: xtts
      batch_size: 2
      parameters:
        device: cuda
        model: 'tts_models/multilingual/multi-dataset/xtts_v2'
apps:
  live_translator:
    profiles:
      configuration1:
        uses:
          tts: tts_xtts
          stt: stt_wrt
        stt_langs: ['en', 'pt']
        tts_langs: ['pt', 'en']
        outbound: sip/bar;cld=1929133
